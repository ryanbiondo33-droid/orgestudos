<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <meta name="description" content="Organizador de estudos para faculdade com planejamento, foco, flashcards e revisão espaçada.">
  <meta property="og:title" content="Estudos — Organizador acadêmico">
  <meta property="og:description" content="Organize disciplinas, provas, tarefas e revisões em um só lugar.">
  <meta property="og:type" content="website">
  <title>Estudos — Organizador acadêmico</title>

  <style>
    :root {
      --bg: #071226;
      --panel: #0d1d3b;
      --panel-2: #142957;
      --panel-3: #1a3670;
      --line: #31518e;
      --text: #f1f5ff;
      --muted: #b9c8e8;
      --accent: #69a1ff;
      --accent-strong: #347df0;
      --green: #55d99c;
      --yellow: #ffd166;
      --orange: #ff9f43;
      --red: #ff7272;
      --focus: #9bc2ff;
      --shadow: 0 12px 30px rgba(0,0,0,.2);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.reduce-motion *,
    body.reduce-motion *::before,
    body.reduce-motion *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }

    button, input, select, textarea { font: inherit; }

    button, summary { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .app {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 70px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: .02em;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 5px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .nav button {
      border: 0;
      border-radius: 9px;
      padding: 9px 14px;
      color: var(--muted);
      background: transparent;
    }

    .nav button:hover,
    .nav button.active {
      color: #fff;
      background: var(--accent-strong);
    }

    .card {
      margin-bottom: 18px;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: var(--shadow);
    }

    .card h2,
    .card h3 {
      margin: 0 0 5px;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: .92rem;
    }

    .center { text-align: center; }

    .btn {
      border: 1px solid var(--accent-strong);
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      background: var(--accent-strong);
      transition: filter .15s, transform .15s;
    }

    .btn:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .btn.secondary {
      color: var(--text);
      background: var(--panel-2);
      border-color: var(--line);
    }

    .btn.danger {
      background: #742d42;
      border-color: #aa4660;
    }

    .btn.small {
      padding: 6px 10px;
      font-size: .85rem;
    }

    .icon-button {
      border: 0;
      padding: 4px 8px;
      color: var(--muted);
      background: transparent;
      font-size: 1.25rem;
    }

    .icon-button:hover { color: var(--red); }

    form { display: grid; gap: 11px; }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      background: var(--bg);
      color-scheme: dark;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: .9rem;
    }

    label span { color: var(--text); }

    .tasks {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .task.done { opacity: .66; }

    .task.done .task-title {
      color: var(--muted);
      text-decoration: line-through;
    }

    .task-main {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-top: 4px;
      color: var(--muted);
      font-size: .8rem;
    }

    .check {
      flex: none;
      width: 30px;
      height: 30px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      color: #fff;
      background: transparent;
      font-weight: 700;
    }

    .task.done .check {
      border-color: var(--green);
      background: var(--green);
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chip {
      padding-left: 7px;
      border-left: 3px solid var(--c, var(--accent));
      color: var(--text);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: .76rem;
    }

    .easy { color: var(--green); background: rgba(85,217,156,.15); }
    .medium { color: var(--yellow); background: rgba(255,209,102,.15); }
    .hard { color: var(--red); background: rgba(255,114,114,.15); }
    .urgent { color: var(--orange); }
    .late { color: var(--red); }

    .empty {
      padding: 22px 5px;
      color: var(--muted);
      text-align: center;
    }

    .progress {
      height: 9px;
      margin: 14px 0 20px;
      overflow: hidden;
      border-radius: 20px;
      background: var(--panel-2);
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .3s;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: var(--accent);
      font-size: 1.7rem;
    }

    .stat span {
      color: var(--muted);
      font-size: .82rem;
    }

    .clock {
      margin: 7px 0;
      font-size: clamp(3.2rem, 12vw, 5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 750;
    }

    .modes,
    .controls,
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .mode {
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 7px 14px;
      color: var(--muted);
      background: var(--panel-2);
    }

    .mode.active {
      color: #fff;
      border-color: var(--accent);
    }

    .message {
      min-height: 1.5em;
      margin: 10px 0;
      color: var(--green);
    }

    .subject-header,
    .exam {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .subject-header h3 {
      padding-left: 10px;
      border-left: 4px solid var(--c);
    }

    .exam {
      padding: 10px 0;
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: .93rem;
    }

    .flashcard {
      min-height: 170px;
      display: grid;
      place-items: center;
      padding: 25px;
      margin: 15px 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--panel-2);
      text-align: center;
      font-size: 1.15rem;
    }

    .flashcard small {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .78rem;
    }

    .review-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .review-buttons button {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 13px;
      color: var(--text);
      background: var(--panel-2);
    }

    .review-buttons button[data-rating="again"] { border-color: var(--red); }
    .review-buttons button[data-rating="hard"] { border-color: var(--yellow); }
    .review-buttons button[data-rating="good"] { border-color: var(--green); }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 5;
      max-width: min(370px, calc(100% - 40px));
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      background: var(--panel-3);
      box-shadow: var(--shadow);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .checkbox {
      display: flex;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 9px;
    }

    .checkbox input { width: auto; }

    @media (max-width: 700px) {
      .top {
        align-items: stretch;
        flex-direction: column;
        text-align: center;
      }

      .nav { justify-content: center; }

      .task {
        align-items: flex-start;
      }

      .task-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>Estudos</h1>
        <p>Um passo de cada vez.</p>
      </div>

      <nav class="nav" aria-label="Navegação principal">
        <button data-action="nav" data-view="today" class="active">Hoje</button>
        <button data-action="nav" data-view="subjects">Disciplinas</button>
        <button data-action="nav" data-view="focus">Foco</button>
        <button data-action="nav" data-view="cards">Revisão</button>
        <button data-action="nav" data-view="settings">Ajustes</button>
      </nav>
    </header>

    <main id="view"></main>
  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script>
    'use strict';

    const STORAGE_KEY = 'studyapp:v2';

    const MODES = {
      focus25: { label: 'Foco 25', seconds: 25 * 60, type: 'focus' },
      focus15: { label: 'Foco 15', seconds: 15 * 60, type: 'focus' },
      break5:  { label: 'Pausa 5', seconds: 5 * 60, type: 'break' },
      break15: { label: 'Pausa 15', seconds: 15 * 60, type: 'break' }
    };

    const defaultState = {
      subjects: [],
      exams: [],
      tasks: [],
      sessions: [],
      cards: [],
      settings: {
        sound: true,
        reduceMotion: false,
        fontSize: 'normal'
      }
    };

    let state = loadState();
    let currentView = 'today';
    let selectedFocusTask = '';
    let timerMessage = '';
    let undoAction = null;

    const timer = {
      mode: 'focus25',
      remaining: MODES.focus25.seconds,
      running: false,
      endAt: 0,
      interval: null
    };

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        return {
          ...clone(defaultState),
          ...saved,
          settings: {
            ...defaultState.settings,
            ...(saved?.settings || {})
          }
        };
      } catch {
        return clone(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function $(selector) {
      return document.querySelector(selector);
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&',
        '<': '<',
        '>': '>',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function today() {
      return new Date().toLocaleDateString('sv-SE');
    }

    function parseDate(value) {
      return new Date(value + 'T00:00:00');
    }

    function addDays(value, amount) {
      const date = parseDate(value);
      date.setDate(date.getDate() + amount);
      return date.toLocaleDateString('sv-SE');
    }

    function daysBetween(start, end) {
      return Math.round((parseDate(end) - parseDate(start)) / 86400000);
    }

    function formatDate(value) {
      return parseDate(value).toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'short'
      });
    }

    function formatTime(seconds) {
      return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function subjectById(id) {
      return state.subjects.find(subject => subject.id === id);
    }

    function showToast(message, actionLabel = '', action = null) {
      const toast = $('#toast');
      toast.innerHTML = `${escapeHTML(message)} ${
        actionLabel ? `<button class="btn small secondary" id="toastAction">${escapeHTML(actionLabel)}</button>` : ''
      }`;
      toast.hidden = false;
      undoAction = action;

      const button = $('#toastAction');
      if (button) button.onclick = () => {
        if (undoAction) undoAction();
        toast.hidden = true;
        undoAction = null;
      };

      setTimeout(() => {
        toast.hidden = true;
        undoAction = null;
      }, 6000);
    }

    function applyPreferences() {
      document.body.classList.toggle('reduce-motion', state.settings.reduceMotion);
      document.documentElement.style.fontSize =
        state.settings.fontSize === 'large' ? '18px' : '16px';
    }

    function difficultyLabel(value) {
      return {
        1: '<span class="badge easy">Fácil</span>',
        2: '<span class="badge medium">Média</span>',
        3: '<span class="badge hard">Difícil</span>'
      }[value] || '';
    }

    function taskPriority(task) {
      const date = task.date || '9999-12-31';
      const overdue = date < today() ? 100000 : 0;
      const dueSoon = Math.max(0, 30 - daysBetween(today(), date)) * 10;
      return overdue + dueSoon + (3 - Number(task.difficulty || 2));
    }

    function pendingTasks() {
      return state.tasks
        .filter(task => !task.done && (!task.date || task.date <= today()))
        .sort((a, b) => taskPriority(b) - taskPriority(a));
    }

    function activityDates() {
      const dates = new Set();

      state.sessions.forEach(session => dates.add(session.date));
      state.tasks.forEach(task => {
        if (task.doneAt) dates.add(task.doneAt);
      });

      return dates;
    }

    function streak() {
      const dates = activityDates();
      let date = today();

      if (!dates.has(date)) date = addDays(date, -1);

      let total = 0;
      while (dates.has(date)) {
        total++;
        date = addDays(date, -1);
      }

      return total;
    }

    function taskHTML(task) {
      const subject = subjectById(task.subjectId);
      const subjectHTML = subject
        ? `<span class="chip" style="--c:${escapeHTML(subject.color)}">${escapeHTML(subject.name)}</span>`
        : '';

      const lateHTML = task.date && task.date < today()
        ? '<span class="late">pode retomar hoje</span>'
        : '';

      const dueHTML = task.date
        ? `<span>${formatDate(task.date)}</span>`
        : '';

      return `
        <li class="task ${task.done ? 'done' : ''}">
          <button
            class="check"
            data-action="toggle-task"
            data-id="${task.id}"
            aria-label="${task.done ? 'Reabrir tarefa' : 'Concluir tarefa'}">
            ${task.done ? '✓' : ''}
          </button>

          <div class="task-main">
            <div class="task-title">${escapeHTML(task.title)}</div>
            <div class="meta">
              ${subjectHTML}
              ${difficultyLabel(task.difficulty)}
              ${dueHTML}
              ${lateHTML}
            </div>
          </div>

          <div class="task-actions">
            ${!task.done ? `<button class="btn small secondary" data-action="focus-task" data-id="${task.id}">Focar</button>` : ''}
            <button
              class="icon-button"
              data-action="delete-task"
              data-id="${task.id}"
              aria-label="Excluir tarefa">×</button>
          </div>
        </li>
      `;
    }

    function subjectOptions(selected = '') {
      return `
        <option value="">Sem disciplina</option>
        ${state.subjects.map(subject => `
          <option value="${subject.id}" ${subject.id === selected ? 'selected' : ''}>
            ${escapeHTML(subject.name)}
          </option>
        `).join('')}
      `;
    }

    function renderToday() {
      const tasks = pendingTasks();
      const visible = tasks.slice(0, 3);
      const completedToday = state.tasks.filter(task => task.doneAt === today()).length;
      const allToday = state.tasks.filter(task => task.date === today()).length;
      const progress = allToday ? Math.min(100, completedToday / allToday * 100) : 0;

      return `
        <section class="card">
          <h2>O que importa agora</h2>
          <p class="sub">
            Você não precisa resolver tudo. Escolha a próxima ação possível.
          </p>

          ${allToday ? `
            <div aria-label="${Math.round(progress)}% das tarefas de hoje concluídas">
              <div class="progress"><span style="width:${progress}%"></span></div>
            </div>
          ` : ''}

          ${visible.length
            ? `<ul class="tasks">${visible.map(taskHTML).join('')}</ul>`
            : `<div class="empty">Não há tarefas disponíveis agora. Aproveite para descansar ou planejar o próximo passo.</div>`
          }

          ${tasks.length > 3
            ? `<p class="sub" style="margin-top:14px">Há mais ${tasks.length - 3} tarefa(s) na fila. Elas aparecerão conforme você avançar.</p>`
            : ''
          }
        </section>

        <section class="card">
          <details>
            <summary>Adicionar uma tarefa</summary>
            <form data-form="addTask" style="margin-top:14px">
              <label>
                <span>O que você precisa fazer?</span>
                <input name="title" maxlength="140" required placeholder="Ex.: Ler o capítulo 2">
              </label>

              <div class="row">
                <label>
                  <span>Disciplina</span>
                  <select name="subjectId">${subjectOptions()}</select>
                </label>

                <label>
                  <span>Esforço</span>
                  <select name="difficulty">
                    <option value="1">Fácil</option>
                    <option value="2" selected>Médio</option>
                    <option value="3">Difícil</option>
                  </select>
                </label>

                <label>
                  <span>Data</span>
                  <input type="date" name="date" value="${today()}">
                </label>
              </div>

              <button class="btn" type="submit">Adicionar tarefa</button>
            </form>
          </details>
        </section>

        <section class="card stats">
          <div class="stat">
            <strong>${completedToday}</strong>
            <span>concluídas hoje</span>
          </div>
          <div class="stat">
            <strong>${state.sessions.filter(session => session.date === today()).length}</strong>
            <span>sessões de foco</span>
          </div>
          <div class="stat">
            <strong>${streak()}</strong>
            <span>dias de sequência</span>
          </div>
        </section>
      `;
    }

    function renderSubjects() {
      const subjectCards = state.subjects.map(subject => {
        const exams = state.exams
          .filter(exam => exam.subjectId === subject.id)
          .sort((a, b) => a.date.localeCompare(b.date));

        return `
          <section class="card">
            <div class="subject-header">
              <h3 style="--c:${escapeHTML(subject.color)}">${escapeHTML(subject.name)}</h3>
              <button
                class="icon-button"
                data-action="delete-subject"
                data-id="${subject.id}"
                aria-label="Excluir disciplina">×</button>
            </div>

            ${exams.length ? exams.map(exam => {
              const remaining = daysBetween(today(), exam.date);
              const status = remaining < 0
                ? 'data encerrada'
                : remaining === 0
                  ? 'hoje'
                  : `em ${remaining} dia(s)`;

              return `
                <div class="exam">
                  <span>
                    ${escapeHTML(exam.name)} · ${formatDate(exam.date)}
                    <small class="${remaining <= 3 ? 'urgent' : ''}">(${status})</small>
                  </span>
                  <button
                    class="icon-button"
                    data-action="delete-exam"
                    data-id="${exam.id}"
                    aria-label="Excluir avaliação">×</button>
                </div>
              `;
            }).join('') : '<p class="sub">Nenhuma avaliação cadastrada.</p>'}

            <form data-form="addExam" style="margin-top:14px">
              <input type="hidden" name="subjectId" value="${subject.id}">

              <div class="row">
                <label>
                  <span>Nome da avaliação</span>
                  <input name="name" required maxlength="70" placeholder="Ex.: Prova 1">
                </label>

                <label>
                  <span>Data</span>
                  <input name="date" required type="date" min="${addDays(today(), 1)}">
                </label>

                <button class="btn" type="submit">Criar plano</button>
              </div>
            </form>
          </section>
        `;
      }).join('');

      return `
        <section class="card">
          <h2>Disciplinas</h2>
          <p class="sub">
            Ao cadastrar uma avaliação, o app cria pequenas etapas de preparação.
          </p>

          <form data-form="addSubject">
            <div class="row">
              <label>
                <span>Nome da disciplina</span>
                <input name="name" maxlength="70" required placeholder="Ex.: Psicologia">
              </label>

              <label>
                <span>Cor</span>
                <input name="color" type="color" value="#69a1ff" aria-label="Cor da disciplina">
              </label>

              <button class="btn" type="submit">Adicionar disciplina</button>
            </div>
          </form>
        </section>

        ${subjectCards || '<div class="empty">Comece cadastrando uma disciplina.</div>'}
      `;
    }

    function renderFocus() {
      const mode = MODES[timer.mode];
      const total = mode.seconds;
      const percentage = ((total - timer.remaining) / total) * 100;
      const tasks = pendingTasks();

      return `
        <section class="card center">
          <h2>Foco</h2>
          <p class="sub">Escolha um período que pareça possível agora.</p>

          <div class="modes">
            ${Object.entries(MODES).map(([key, item]) => `
              <button
                class="mode ${key === timer.mode ? 'active' : ''}"
                data-action="set-mode"
                data-mode="${key}">
                ${item.label}
              </button>
            `).join('')}
          </div>

          <div class="clock" id="clock" aria-live="polite">${formatTime(timer.remaining)}</div>

          <div class="progress" aria-label="Progresso do período">
            <span id="timerProgress" style="width:${percentage}%"></span>
          </div>

          <p class="message" id="timerMessage">${escapeHTML(timerMessage)}</p>

          <div class="controls">
            <button class="btn" data-action="toggle-timer">
              ${timer.running ? 'Pausar' : 'Iniciar'}
            </button>
            <button class="btn secondary" data-action="reset-timer">Reiniciar</button>
            <button class="btn secondary" data-action="add-time">+5 minutos</button>
          </div>

          <label style="max-width:500px;margin:20px auto 0;text-align:left">
            <span>Tarefa desta sessão</span>
            <select data-change="focus-task">
              <option value="">Foco livre</option>
              ${tasks.map(task => `
                <option value="${task.id}" ${task.id === selectedFocusTask ? 'selected' : ''}>
                  ${escapeHTML(task.title)}
                </option>
              `).join('')}
            </select>
          </label>
        </section>

        <section class="card stats">
          <div class="stat">
            <strong>${state.sessions.filter(session => session.date === today()).length}</strong>
            <span>sessões hoje</span>
          </div>
          <div class="stat">
            <strong>${state.sessions.filter(session => session.date === today()).reduce((sum, session) => sum + session.minutes, 0)}</strong>
            <span>minutos de foco</span>
          </div>
          <div class="stat">
            <strong>${streak()}</strong>
            <span>dias seguidos</span>
          </div>
        </section>

        <section class="card">
          <h2>Fechamento da sessão</h2>
          <p class="sub">Registrar uma frase ajuda a transformar tempo de estudo em aprendizado observável.</p>

          <form data-form="reflection">
            <textarea name="text" maxlength="500" placeholder="O que você conseguiu entender ou fazer?"></textarea>
            <button class="btn secondary" type="submit">Salvar reflexão</button>
          </form>
        </section>
      `;
    }

    function dueCards() {
      return state.cards
        .filter(card => !card.nextReview || card.nextReview <= today())
        .sort((a, b) => (a.nextReview || '').localeCompare(b.nextReview || ''));
    }

    function renderCards() {
      const due = dueCards();
      const card = due[0];

      return `
        <section class="card">
          <h2>Revisão ativa</h2>
          <p class="sub">
            Tente lembrar antes de revelar a resposta. Reler passivamente não é necessário aqui.
          </p>

          <form data-form="addCard">
            <div class="row">
              <label>
                <span>Disciplina</span>
                <select name="subjectId">${subjectOptions()}</select>
              </label>

              <label>
                <span>Frente</span>
                <input name="front" required maxlength="180" placeholder="Qual é a pergunta?">
              </label>
            </div>

            <label>
              <span>Resposta</span>
              <textarea name="back" required maxlength="500" placeholder="Explique com suas palavras"></textarea>
            </label>

            <button class="btn" type="submit">Criar flashcard</button>
          </form>
        </section>

        <section class="card center">
          <h2>Cartões para revisar</h2>
          ${
            card
              ? `
                <div class="flashcard" id="flashcard">
                  <div>
                    <small>${card.revealed ? 'Resposta' : 'Pergunta'}</small>
                    ${escapeHTML(card.revealed ? card.back : card.front)}
                  </div>
                </div>

                <div class="actions">
                  <button class="btn secondary" data-action="reveal-card" data-id="${card.id}">
                    ${card.revealed ? 'Ocultar resposta' : 'Revelar resposta'}
                  </button>
                </div>

                ${card.revealed ? `
                  <div class="review-buttons" style="margin-top:14px">
                    <button data-action="rate-card" data-rating="again" data-id="${card.id}">Novamente</button>
                    <button data-action="rate-card" data-rating="hard" data-id="${card.id}">Difícil</button>
                    <button data-action="rate-card" data-rating="good" data-id="${card.id}">Lembrei</button>
                  </div>
                ` : ''}
              `
              : `<div class="empty">Nenhum cartão precisa de revisão agora.</div>`
          }
        </section>
      `;
    }

    function renderSettings() {
      return `
        <section class="card">
          <h2>Ajustes</h2>
          <p class="sub">Adapte o ambiente ao seu jeito de estudar.</p>

          <div class="settings-grid">
            <label class="checkbox">
              <input
                type="checkbox"
                data-setting="sound"
                ${state.settings.sound ? 'checked' : ''}>
              <span>Som ao terminar o timer</span>
            </label>

            <label class="checkbox">
              <input
                type="checkbox"
                data-setting="reduceMotion"
                ${state.settings.reduceMotion ? 'checked' : ''}>
              <span>Reduzir animações</span>
            </label>

            <label>
              <span>Tamanho do texto</span>
              <select data-setting="fontSize">
                <option value="normal" ${state.settings.fontSize === 'normal' ? 'selected' : ''}>Normal</option>
                <option value="large" ${state.settings.fontSize === 'large' ? 'selected' : ''}>Grande</option>
              </select>
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Backup dos dados</h2>
          <p class="sub">
            Seus dados ficam neste navegador. Exporte uma cópia para evitar perdas ao limpar o histórico.
          </p>

          <div class="actions">
            <button class="btn" data-action="export-data">Exportar backup</button>
            <label class="btn secondary" style="display:inline-block">
              Importar backup
              <input id="importFile" type="file" accept="application/json" hidden>
            </label>
            <button class="btn danger" data-action="clear-data">Apagar tudo</button>
          </div>
        </section>

        <section class="card">
          <h2>Como estudar melhor</h2>
          <p class="sub">
            Use a tela Hoje para escolher uma ação pequena, o Foco para trabalhar em blocos curtos
            e a Revisão para recuperar o conteúdo da memória antes de consultar a resposta.
          </p>
        </section>
      `;
    }

    function render() {
      const views = {
        today: renderToday,
        subjects: renderSubjects,
        focus: renderFocus,
        cards: renderCards,
        settings: renderSettings
      };

      $('#view').innerHTML = views[currentView]();

      document.querySelectorAll('.nav button').forEach(button => {
        button.classList.toggle('active', button.dataset.view === currentView);
      });

      applyPreferences();
    }

    function generatePlan(exam) {
      const days = Math.min(Math.max(daysBetween(today(), exam.date), 1), 30);
      const start = addDays(exam.date, -days);

      for (let index = 0; index < days; index++) {
        let title;
        let difficulty;

        if (days === 1) {
          title = 'Revisar conteúdo';
          difficulty = 2;
        } else if (index === 0) {
          title = 'Reunir material';
          difficulty = 1;
        } else if (index === days - 1) {
          title = 'Simular a avaliação';
          difficulty = 3;
        } else if (index < days / 2) {
          title = 'Revisar conteúdo';
          difficulty = 2;
        } else {
          title = 'Praticar com questões';
          difficulty = 3;
        }

        state.tasks.push({
          id: uid(),
          title: `${title} — ${exam.name}`,
          subjectId: exam.subjectId,
          examId: exam.id,
          difficulty,
          date: addDays(start, index),
          done: false,
          doneAt: null
        });
      }
    }

    function addDaysForRating(rating) {
      return {
        again: 1,
        hard: 3,
        good: 7
      }[rating] || 1;
    }

    function playBeep() {
      if (!state.settings.sound) return;

      try {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = context.createOscillator();
        const gain = context.createGain();

        oscillator.frequency.value = 700;
        gain.gain.value = .12;

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();
        oscillator.stop(context.currentTime + .25);
      } catch {
        // O navegador pode bloquear áudio sem interação prévia.
      }
    }

    function updateTimerScreen() {
      const clock = $('#clock');
      const progress = $('#timerProgress');

      if (!clock || !progress) return;

      const total = MODES[timer.mode].seconds;
      clock.textContent = formatTime(timer.remaining);
      progress.style.width = `${((total - timer.remaining) / total) * 100}%`;

      document.title = timer.running
        ? `${formatTime(timer.remaining)} · Estudos`
        : 'Estudos — Organizador acadêmico';
    }

    function tick() {
      timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now()) / 1000));
      updateTimerScreen();

      if (timer.remaining <= 0) finishTimer();
    }

    function finishTimer() {
      clearInterval(timer.interval);
      timer.running = false;

      const currentMode = MODES[timer.mode];
      playBeep();

      if (currentMode.type === 'focus') {
        state.sessions.push({
          id: uid(),
          date: today(),
          minutes: currentMode.seconds / 60,
          taskId: selectedFocusTask || null,
          reflection: ''
        });

        timerMessage = 'Sessão concluída. Faça uma pausa antes de continuar.';
        timer.mode = 'break5';
      } else {
        timerMessage = 'Pausa concluída. Você pode começar outra rodada.';
        timer.mode = 'focus25';
      }

      timer.remaining = MODES[timer.mode].seconds;
      saveState();
      render();
    }

    function toggleTimer() {
      if (timer.running) {
        clearInterval(timer.interval);
        timer.running = false;
      } else {
        timer.running = true;
        timer.endAt = Date.now() + timer.remaining * 1000;
        timer.interval = setInterval(tick, 250);
      }

      render();
    }

    function resetTimer() {
      clearInterval(timer.interval);
      timer.running = false;
      timer.remaining = MODES[timer.mode].seconds;
      timerMessage = '';
      render();
    }

    function addFiveMinutes() {
      timer.remaining += 5 * 60;

      if (timer.running) {
        timer.endAt += 5 * 60 * 1000;
      }

      updateTimerScreen();
      showToast('Foram adicionados cinco minutos.');
    }

    function exportData() {
      const data = JSON.stringify(state, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = `backup-estudos-${today()}.json`;
      link.click();

      URL.revokeObjectURL(url);
      showToast('Backup exportado.');
    }

    function importData(file) {
      const reader = new FileReader();

      reader.onload = event => {
        try {
          const imported = JSON.parse(event.target.result);

          if (!imported || !Array.isArray(imported.tasks) || !Array.isArray(imported.subjects)) {
            throw new Error('Formato inválido');
          }

          state = {
            ...clone(defaultState),
            ...imported,
            settings: {
              ...defaultState.settings,
              ...(imported.settings || {})
            }
          };

          saveState();
          render();
          showToast('Backup importado com sucesso.');
        } catch {
          showToast('Não foi possível importar esse arquivo.');
        }
      };

      reader.readAsText(file);
    }

    const formHandlers = {
      addTask(data) {
        state.tasks.push({
          id: uid(),
          title: data.title.trim(),
          subjectId: data.subjectId || null,
          difficulty: Number(data.difficulty),
          date: data.date || null,
          done: false,
          doneAt: null,
          examId: null
        });

        showToast('Tarefa adicionada.');
      },

      addSubject(data) {
        state.subjects.push({
          id: uid(),
          name: data.name.trim(),
          color: data.color
        });

        showToast('Disciplina adicionada.');
      },

      addExam(data) {
        const exam = {
          id: uid(),
          subjectId: data.subjectId,
          name: data.name.trim(),
          date: data.date
        };

        state.exams.push(exam);
        generatePlan(exam);
        showToast('Avaliação criada e plano de estudo gerado.');
      },

      addCard(data) {
        state.cards.push({
          id: uid(),
          subjectId: data.subjectId || null,
          front: data.front.trim(),
          back: data.back.trim(),
          nextReview: today(),
          revealed: false
        });

        showToast('Flashcard criado.');
      },

      reflection(data) {
        const session = [...state.sessions].reverse().find(session => session.date === today());

        if (session && data.text.trim()) {
          session.reflection = data.text.trim();
          showToast('Reflexão salva.');
        } else {
          showToast('A reflexão será salva ao concluir uma sessão de foco.');
        }
      }
    };

    document.addEventListener('submit', event => {
      const form = event.target.closest('[data-form]');
      if (!form) return;

      event.preventDefault();

      const handler = formHandlers[form.dataset.form];
      if (!handler) return;

      handler(Object.fromEntries(new FormData(form)));
      saveState();
      render();
    });

    document.addEventListener('click', event => {
      const element = event.target.closest('[data-action]');
      if (!element) return;

      const action = element.dataset.action;
      const id = element.dataset.id;

      if (action === 'nav') {
        currentView = element.dataset.view;
        render();
        return;
      }

      if (action === 'toggle-task') {
        const task = state.tasks.find(item => item.id === id);
        if (!task) return;

        const previous = task.done;
        task.done = !task.done;
        task.doneAt = task.done ? today() : null;

        saveState();

        showToast(
          task.done ? 'Tarefa concluída.' : 'Tarefa reaberta.',
          'Desfazer',
          () => {
            task.done = previous;
            task.doneAt = previous ? task.doneAt : null;
            saveState();
            render();
          }
        );

        render();
        return;
      }

      if (action === 'delete-task') {
        const index = state.tasks.findIndex(item => item.id === id);
        if (index < 0) return;

        const removed = state.tasks.splice(index, 1)[0];
        saveState();

        showToast('Tarefa removida.', 'Desfazer', () => {
          state.tasks.splice(index, 0, removed);
          saveState();
          render();
        });

        render();
        return;
      }

      if (action === 'focus-task') {
        selectedFocusTask = id;
        currentView = 'focus';
        render();
        return;
      }

      if (action === 'set-mode') {
        clearInterval(timer.interval);
        timer.running = false;
        timer.mode = element.dataset.mode;
        timer.remaining = MODES[timer.mode].seconds;
        timerMessage = '';
        render();
        return;
      }

      if (action === 'toggle-timer') {
        toggleTimer();
        return;
      }

      if (action === 'reset-timer') {
        resetTimer();
        return;
      }

      if (action === 'add-time') {
        addFiveMinutes();
        return;
      }

      if (action === 'delete-exam') {
        const exam = state.exams.find(item => item.id === id);
        if (!exam) return;

        state.exams = state.exams.filter(item => item.id !== id);
        state.tasks = state.tasks.filter(task => task.examId !== id || task.done);
        saveState();
        showToast(`A avaliação "${exam.name}" foi removida.`);
        render();
        return;
      }

      if (action === 'delete-subject') {
        const subject = state.subjects.find(item => item.id === id);
        if (!subject) return;

        const examIds = state.exams
          .filter(exam => exam.subjectId === id)
          .map(exam => exam.id);

        state.subjects = state.subjects.filter(item => item.id !== id);
        state.exams = state.exams.filter(exam => exam.subjectId !== id);
        state.tasks = state.tasks.filter(task =>
          task.subjectId !== id &&
          !examIds.includes(task.examId)
        );

        saveState();
        showToast(`A disciplina "${subject.name}" foi removida.`);
        render();
        return;
      }

      if (action === 'reveal-card') {
        const card = state.cards.find(item => item.id === id);
        if (!card) return;

        card.revealed = !card.revealed;
        render();
        return;
      }

      if (action === 'rate-card') {
        const card = state.cards.find(item => item.id === id);
        if (!card) return;

        card.nextReview = addDays(today(), addDaysForRating(element.dataset.rating));
        card.revealed = false;
        saveState();
        showToast('Revisão registrada.');
        render();
        return;
      }

      if (action === 'export-data') {
        exportData();
        return;
      }

      if (action === 'clear-data') {
        if (!confirm('Apagar todas as disciplinas, tarefas, sessões e flashcards?')) return;

        state = clone(defaultState);
        saveState();
        render();
        showToast('Dados apagados.');
      }
    });

    document.addEventListener('change', event => {
      const setting = event.target.dataset.setting;

      if (setting) {
        state.settings[setting] = event.target.type === 'checkbox'
          ? event.target.checked
          : event.target.value;

        saveState();
        applyPreferences();

        if (setting === 'reduceMotion' || setting === 'fontSize') render();
      }

      if (event.target.dataset.change === 'focus-task') {
        selectedFocusTask = event.target.value;
      }

      if (event.target.id === 'importFile' && event.target.files[0]) {
        importData(event.target.files[0]);
        event.target.value = '';
      }
    });

    applyPreferences();
    render();
  </script>
</body>
</html>
